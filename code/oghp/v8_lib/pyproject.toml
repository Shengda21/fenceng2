[build-system]
requires = []
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "v8lib"
version = "0.1.0"
description = "Environment-agnostic selector arms, encoders, probes, and analysis for selector experiments"
requires-python = ">=3.11"

[project.optional-dependencies]
full = [
  "numpy",
  "scipy",
  "scikit-learn",
  "torch",
  "openai>=1.0",
  "pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
